<app-sidebar-component></app-sidebar-component>
<section class="dashboard bg-light min-vh-100">
  <app-header-component></app-header-component>
  <section class="p-md-5 py-5 px-3">
    <section>
      <app-breadcrumb-component [breadcrumbItems]="breadcrumbItems"></app-breadcrumb-component>
    </section>
    <app-add-button-component
      [textButton]="'Cliente'"
      (addClick)="onAddClient()"
    ></app-add-button-component>
    <div class="table-responsive">
      @if (clients$ | async; as clients) {
        <app-table-component [columns]="columns" [items]="clients"></app-table-component>
      }
    </div>
  </section>
</section>
