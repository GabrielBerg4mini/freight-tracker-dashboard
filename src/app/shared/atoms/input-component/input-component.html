@if (isInput) {
  <input
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    (input)="handleInput($event)"
    (blur)="onTouched()"
    [class]="classCustom"
    class="form-control"
    [id]="idCustom"
  />
} @else if (isTextarea) {
  <textarea
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    (input)="handleInput($event)"
    (blur)="onTouched()"
    [class]="classCustom"
    [rows]="rows"
    class="form-control"
    [id]="idCustom"
  ></textarea>
} @else {
  <select
    [value]="value"
    [disabled]="disabled"
    (change)="handleInput($event)"
    (blur)="onTouched()"
    [class]="classCustom"
    class="form-control"
    [id]="idCustom"
  >
    <ng-content></ng-content>
  </select>
}
